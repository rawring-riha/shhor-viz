name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 9 * * 1,2,3,4,5,6,7'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Ping Supabase Storage
        run: |
          node -e "
          import('./src/lib/supabaseConfig.js').then(({ SUPABASE_URL, SUPABASE_KEY }) => {
            fetch(\`\${SUPABASE_URL}/storage/v1/bucket\`, {
              headers: {
                apikey: SUPABASE_KEY,
                Authorization: \`Bearer \${SUPABASE_KEY}\`
              }
            }).then(r => console.log('Status:', r.status));
          });
          "